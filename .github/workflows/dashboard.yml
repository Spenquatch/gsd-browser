name: Dashboard CI

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "gsd-dashboard/**"
      - ".github/workflows/dashboard.yml"
  pull_request:
    branches: [main]
    paths:
      - "gsd-dashboard/**"
      - ".github/workflows/dashboard.yml"

defaults:
  run:
    working-directory: gsd-dashboard

jobs:
  build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gsd-dashboard/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test || true
        # Tests may not exist yet; don't fail CI

      - run: npm run build
        env:
          # Clerk key not needed for build (loaded at runtime)
          VITE_CLERK_PUBLISHABLE_KEY: ""
          VITE_GSD_API_BASE_URL: ""

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: gsd-dashboard/dist/
          retention-days: 7

