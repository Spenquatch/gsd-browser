name: Azure Deploy

on:
  push:
    branches: [main]
    paths:
      - "gsd-browser/**"
      - "gsd-dashboard/**"
      - "infra/**"
      - ".github/workflows/azure-deploy.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: false
        default: "latest"

env:
  RESOURCE_GROUP: gsd-prod-rg
  ACR_NAME: gsdprodacr
  IMAGE_NAME: gsd-browser

permissions:
  id-token: write
  contents: read

jobs:
  # ── Build & Push Docker Image ──────────────────────────────────────────
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ] && [ "${{ github.event.inputs.image_tag }}" != "latest" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR Login
        run: az acr login -n ${{ env.ACR_NAME }}

      - name: Build and push
        run: |
          IMAGE="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}"
          TAG="${{ steps.meta.outputs.tag }}"

          docker build \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            -f gsd-browser/docker/Dockerfile \
            gsd-browser

          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"

  # ── Deploy Infrastructure ──────────────────────────────────────────────
  deploy-infra:
    name: Deploy Bicep
    runs-on: ubuntu-latest
    needs: build-push
    outputs:
      api_fqdn: ${{ steps.deploy.outputs.apiFqdn }}
      worker_fqdn: ${{ steps.deploy.outputs.workerFqdn }}
      mgmt_fqdn: ${{ steps.deploy.outputs.mgmtFqdn }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        id: deploy
        run: |
          DEPLOY_NAME="gsd-ci-${GITHUB_RUN_NUMBER}"
          az deployment sub create \
            --name "$DEPLOY_NAME" \
            --location eastus \
            --template-file infra/main.bicep \
            --parameters infra/parameters/prod.bicepparam \
            --parameters anthropicApiKey="${{ secrets.ANTHROPIC_API_KEY }}" \
            --parameters imageTag="${{ needs.build-push.outputs.image_tag }}"

          # Extract outputs
          echo "apiFqdn=$(az deployment sub show -n "$DEPLOY_NAME" --query 'properties.outputs.apiFqdn.value' -o tsv)" >> "$GITHUB_OUTPUT"
          echo "workerFqdn=$(az deployment sub show -n "$DEPLOY_NAME" --query 'properties.outputs.workerFqdn.value' -o tsv)" >> "$GITHUB_OUTPUT"
          echo "mgmtFqdn=$(az deployment sub show -n "$DEPLOY_NAME" --query 'properties.outputs.mgmtFqdn.value' -o tsv)" >> "$GITHUB_OUTPUT"

  # ── Deploy Dashboard ───────────────────────────────────────────────────
  deploy-dashboard:
    name: Deploy Dashboard
    runs-on: ubuntu-latest
    needs: deploy-infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gsd-dashboard/package-lock.json

      - name: Build dashboard
        working-directory: gsd-dashboard
        run: |
          npm ci
          npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_GSD_API_BASE_URL: https://${{ needs.deploy-infra.outputs.api_fqdn }}
          VITE_GSD_MGMT_API_BASE_URL: https://${{ needs.deploy-infra.outputs.mgmt_fqdn }}
          VITE_GSD_WORKER_BASE_URL: https://${{ needs.deploy-infra.outputs.worker_fqdn }}

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: gsd-dashboard/dist
          skip_app_build: true

  # ── Smoke Test ─────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-infra, deploy-dashboard]
    steps:
      - name: Check API health
        run: |
          for i in $(seq 1 10); do
            if curl -sf "https://${{ needs.deploy-infra.outputs.api_fqdn }}/.well-known/oauth-protected-resource" > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            echo "Attempt $i/10 — waiting 15s..."
            sleep 15
          done
          echo "API health check failed"
          exit 1

      - name: Check Management API health
        run: |
          curl -sf "https://${{ needs.deploy-infra.outputs.mgmt_fqdn }}/healthz" || \
            echo "Warning: Management API health check failed (may still be starting)"

      - name: Check Worker health
        run: |
          curl -sf "https://${{ needs.deploy-infra.outputs.worker_fqdn }}/healthz" || \
            echo "Warning: Worker health check failed (may still be starting)"
