name: Dashboard Build & Deploy (SWA)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "gsd-dashboard/**"
      - ".github/workflows/dashboard-build.yml"

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gsd-dashboard/package-lock.json

      - name: Build dashboard
        working-directory: gsd-dashboard
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_GSD_API_BASE_URL: ${{ secrets.VITE_GSD_API_BASE_URL }}
          VITE_GSD_CLERK_JWT_TEMPLATE: ${{ secrets.VITE_GSD_CLERK_JWT_TEMPLATE }}
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test || true
          npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: gsd-dashboard/dist
          skip_app_build: true

